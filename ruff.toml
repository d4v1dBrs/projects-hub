# Linter (único tooling de calidad del repo):  py -3.12 -m ruff check .
line-length = 100
target-version = "py312"
extend-exclude = ["data", "docs"]

[lint]
# F = pyflakes (imports/vars sin usar, redefiniciones, nombres indefinidos) — lo más valioso.
# E/W = pycodestyle. E501 (largo de línea) se ignora: el código financiero tiene líneas largas
# deliberadas y no usamos `ruff format`. E741 (nombres ambiguos l/I/O) también se ignora.
select = ["F", "E", "W"]
# E501 largo de línea (deliberado, sin `ruff format`); E701/E702 sentencias compactas en una
# línea (estilo del codebase, ej. `if not x: return`); E731 lambda asignada; E741 nombres l/I/O;
# E402 import no-top (run.py y scripts/ importan settings después del guard de versión).
ignore = ["E501", "E701", "E702", "E731", "E741", "E402"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
