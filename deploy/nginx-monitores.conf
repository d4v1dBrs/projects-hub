# /etc/nginx/sites-available/monitores  (→ sites-enabled/monitores)
# Proxy :80 → uvicorn :8000 (deploy/monitores.service). Sin TLS todavía: cuando haya
# dominio, `bash deploy/setup-https.sh <dominio> <email>` reescribe este vhost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # SSE (/stream): sin buffering y sin el read-timeout default (60s), o nginx corta
    # el push de los paneles cada minuto. SÓLO acá: en `location /` esos defaults son
    # justamente los que cortan un upstream colgado y absorben clientes lentos.
    location = /stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Necesarios para uvicorn detrás de un proxy reverso
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
